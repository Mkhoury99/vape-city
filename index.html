<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vape City — choose a version</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #070707; color: #ebe7e1; }
  body { min-height: 100%; font-family: "Barlow Condensed", Impact, sans-serif; }
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: clamp(24px, 5vw, 64px);
    background:
      linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.88) 100%),
      url("./assets/the-customer.png") center 30% / cover no-repeat;
  }
  .kicker { letter-spacing: 0.22em; text-transform: uppercase; font-size: 14px; color: #c9c4bd; }
  h1 {
    margin: 10px 0 8px;
    font-weight: 700;
    font-size: clamp(64px, 12vw, 140px);
    line-height: 0.85;
    letter-spacing: 0.02em;
    color: #ff2d2d;
    text-shadow: 6px 6px 0 #000;
  }
  p { margin: 0 0 28px; max-width: 420px; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 22px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  a.btn {
    display: inline-flex;
    align-items: center;
    min-height: 56px;
    padding: 12px 26px;
    text-decoration: none;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 18px;
    font-weight: 600;
  }
  a.v2 { background: #d42a20; color: #fff; }
  a.v1 { background: transparent; color: #ebe7e1; border: 1px solid rgba(235,231,225,0.5); }
  a.btn:hover { color: #fff; }
  .note { margin-top: 22px; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #a8a39c; }
</style>
</head>
<body>
  <main class="hero">
    <div class="kicker">Kennesaw, GA · 21+ only</div>
    <h1>VAPE<br>CITY</h1>
    <p>Two cuts of the same shop. Pick the one you want to walk through.</p>
    <div class="row">
      <a class="btn v2" href="./v2/">Version 2</a>
      <a class="btn v1" href="./v1/">Version 1</a>
    </div>
    <div class="note">The rain's free · Everything else, bring ID</div>
  </main>
</body>
</html>
